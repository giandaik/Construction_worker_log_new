name: Mobile

# Proves what this repo cannot prove on a machine without a native toolchain:
# the static export builds, the committed Xcode/Gradle projects compile against
# it, and a signed AAB is produced when the signing secrets are present.
#
# The iOS job signs nothing — TestFlight uploads stay manual so a release is a
# deliberate act, not a merge side effect.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'utils/**'
      - 'public/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'next.config.mobile.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'ios/**'
      - 'android/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # Inlined into the bundle, so it must be the real backend. Override with the
  # repository variable API_BASE_URL when the deployment moves; the fallback is
  # the production Vercel deployment. A placeholder here ships an app that
  # installs and then fails every request.
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://construction-worker-log-new.vercel.app' }}
  # Capacitor 8 emits `gradlew` expecting JDK 17+; the project targets 21.
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  android:
    name: Export + debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - run: npm run version:check
      - run: npm run build:mobile
      - run: npx cap sync android
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-release:
    name: Signed AAB (needs signing secrets)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - run: npm run version:check
      - run: npm run build:mobile
      - run: npx cap sync android
      - name: Restore the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci-android-keystore.sh
      - run: cd android && ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  android-firebase:
    name: Distribute signed APK to Firebase testers
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - run: npm run version:check
      - run: npm run build:mobile
      - run: npx cap sync android
      - name: Restore the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci-android-keystore.sh
      # Signed with the upload key, not the runner's throwaway debug key: testers
      # install each build over the last one instead of uninstalling first.
      - run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Authenticate to Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set — see DEPLOY.md"; exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Resolve release notes
        # On workflow_dispatch github.event.head_commit is null, so the notes used
        # to fall back to "Build of app-release.apk at <time>" and testers could
        # not tell which change they were installing. Fall back to the tip commit
        # subject instead. Multiline values need the heredoc form in GITHUB_ENV.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          notes="${COMMIT_MESSAGE:-$(git log -1 --pretty=%s)}"
          {
            echo 'FIREBASE_RELEASE_NOTES<<__NOTES__'
            echo "$notes"
            echo '__NOTES__'
          } >> "$GITHUB_ENV"
          echo "release notes: $notes"
      - name: Distribute
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
        run: |
          node scripts/dist-firebase.mjs \
            android/app/build/outputs/apk/release/app-release.apk \
            --platform android --groups testers
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  ios:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync ios
      - run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
